# Kontrola celého indexu po každé změně v main. Pull requesty kontroluje kontrola-pr.yml.
name: Kontrola dat
on:
  push:
    branches: [main]
    paths: ["knihy/**", "tools/kontrola.py"]
  # Spouští ho i kontrola-pr.yml po automatickém sloučení, které push workflow nespustí.
  workflow_dispatch:
jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Celý index
        run: python tools/kontrola.py
