# PREHLED.md se generuje jen tady, z dat v main; pull requesty ho nemění, jinak by se po každém sloučení hádaly.
name: Přehled
on:
  push:
    branches: [main]
    paths: ["knihy/**", "tools/prehled.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prehled
  cancel-in-progress: false
jobs:
  prehled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/prehled.py
      - name: Commit PREHLED.md
        run: |
          if git diff --quiet -- PREHLED.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PREHLED.md
          git commit -m "PREHLED.md podle dat v main"
          # Mezitím mohl přibýt další commit; přehled se pak přegeneruje nad ním.
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main && git reset --hard origin/main && python tools/prehled.py
            git diff --quiet -- PREHLED.md && exit 0
            git add PREHLED.md && git commit -m "PREHLED.md podle dat v main"
          done
          exit 1
